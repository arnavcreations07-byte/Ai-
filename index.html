<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen — AI, in the open</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --accent-1: #7C5CFF;
    --accent-2: #2DD4BF;
    --accent-3: #FF7A9C;
    --glass: rgba(255,255,255,0.07);
    --glass-strong: rgba(255,255,255,0.13);
    --glass-border: rgba(255,255,255,0.16);
    --text: #F5F5F7;
    --muted: #A1A1AC;
    --bg-1: #0b0b12;
    --bg-2: #14101f;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background: transparent;
    font-family:'Inter', sans-serif;
    color:var(--text);
    overflow:hidden;
  }
  .stage{
    position:relative;
    height:100vh;
    width:100%;
    background:
      radial-gradient(circle at 15% 20%, rgba(124,92,255,0.35), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(45,212,191,0.28), transparent 50%),
      radial-gradient(circle at 50% 90%, rgba(255,122,156,0.22), transparent 55%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    overflow:hidden;
  }
  .orb{
    position:absolute;
    border-radius:50%;
    filter: blur(60px);
    opacity:0.55;
    animation: float 18s ease-in-out infinite;
    pointer-events:none;
  }
  .orb1{ width:380px; height:380px; background:var(--accent-1); top:-100px; left:-80px; animation-delay:0s;}
  .orb2{ width:320px; height:320px; background:var(--accent-2); bottom:-120px; right:-60px; animation-delay:4s;}
  .orb3{ width:260px; height:260px; background:var(--accent-3); top:40%; right:20%; animation-delay:8s; opacity:0.35;}
  @keyframes float{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(30px,-40px) scale(1.08); }
  }
  @media (prefers-reduced-motion: reduce){
    .orb{ animation: none; }
  }

  .layout{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    height:100%;
    max-width:820px;
    margin:0 auto;
    padding:22px 20px 20px;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:18px;
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    margin-bottom:16px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-mark{
    width:30px; height:30px;
    border-radius:9px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    box-shadow: 0 0 18px rgba(124,92,255,0.5);
  }
  .brand-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:17px;
    letter-spacing:0.2px;
  }
  .brand-tag{
    font-size:11px;
    color:var(--muted);
    font-family:'JetBrains Mono', monospace;
  }
  .clear-btn{
    background:transparent;
    border:1px solid var(--glass-border);
    color:var(--muted);
    padding:7px 14px;
    border-radius:10px;
    font-size:12px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    transition: all .2s ease;
  }
  .clear-btn:hover{ color:var(--text); background:var(--glass-strong); }
  .clear-btn:focus-visible{ outline:2px solid var(--accent-2); outline-offset:2px; }

  .chat-window{
    flex:1;
    overflow-y:auto;
    padding:8px 4px 12px;
    display:flex;
    flex-direction:column;
    gap:14px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.2) transparent;
  }
  .chat-window::-webkit-scrollbar{ width:6px; }
  .chat-window::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.18); border-radius:6px; }

  .empty-state{
    margin:auto;
    text-align:center;
    color:var(--muted);
    padding:30px;
  }
  .empty-state .glyph{
    font-family:'Space Grotesk', sans-serif;
    font-size:26px;
    color:var(--text);
    margin-bottom:8px;
  }
  .empty-state p{ font-size:13px; max-width:320px; margin:0 auto; line-height:1.6; }

  .msg-row{ display:flex; }
  .msg-row.user{ justify-content:flex-end; }
  .msg-row.assistant{ justify-content:flex-start; }

  .bubble{
    max-width:78%;
    padding:13px 16px;
    border-radius:16px;
    font-size:14.5px;
    line-height:1.55;
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    border:1px solid var(--glass-border);
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .bubble.user{
    background: linear-gradient(135deg, rgba(124,92,255,0.32), rgba(124,92,255,0.14));
    border-color: rgba(124,92,255,0.4);
    border-bottom-right-radius:5px;
  }
  .bubble.assistant{
    background: var(--glass);
    border-bottom-left-radius:5px;
  }
  .bubble .role-label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:5px;
  }

  .typing{
    display:flex;
    gap:5px;
    padding:14px 16px;
  }
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background:var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:0.15s; }
  .typing span:nth-child(3){ animation-delay:0.3s; }
  @keyframes bounce{
    0%,60%,100%{ transform:translateY(0); opacity:0.4; }
    30%{ transform:translateY(-5px); opacity:1; }
  }

  form.composer{
    display:flex;
    align-items:flex-end;
    gap:10px;
    padding:10px;
    margin-top:14px;
    background:var(--glass-strong);
    border:1px solid var(--glass-border);
    border-radius:18px;
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
  }
  textarea{
    flex:1;
    resize:none;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    line-height:1.5;
    max-height:140px;
    padding:9px 6px;
  }
  textarea::placeholder{ color:var(--muted); }
  button.send{
    flex-shrink:0;
    width:42px; height:42px;
    border-radius:12px;
    border:none;
    cursor:pointer;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    display:flex; align-items:center; justify-content:center;
    transition: transform .15s ease, opacity .15s ease;
  }
  button.send:disabled{ opacity:0.4; cursor:not-allowed; }
  button.send:not(:disabled):hover{ transform: scale(1.05); }
  button.send:focus-visible{ outline:2px solid var(--accent-2); outline-offset:2px; }
  button.send svg{ width:18px; height:18px; }

  .error-note{
    text-align:center;
    color:#ffb4b4;
    font-size:12px;
    padding:8px;
    font-family:'JetBrains Mono', monospace;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <div class="layout">
    <header>
      <div class="brand">
        <div class="brand-mark"></div>
        <div>
          <div class="brand-name">Lumen</div>
          <div class="brand-tag">glass · always on</div>
        </div>
      </div>
      <button class="clear-btn" id="clearBtn">Clear chat</button>
    </header>

    <div class="chat-window" id="chatWindow">
      <div class="empty-state" id="emptyState">
        <div class="glyph">Say something.</div>
        <p>This is a see-through space to think — ask a question, brainstorm, or just talk something through.</p>
      </div>
    </div>

    <form class="composer" id="composerForm">
      <textarea id="userInput" rows="1" placeholder="Message Lumen…" aria-label="Message"></textarea>
      <button type="submit" class="send" id="sendBtn" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="white" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </button>
    </form>
  </div>
</div>

<script>
  const chatWindow = document.getElementById('chatWindow');
  const emptyState = document.getElementById('emptyState');
  const form = document.getElementById('composerForm');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const clearBtn = document.getElementById('clearBtn');

  const STORAGE_KEY = 'lumen_chat_history';
  let history = [];

  function saveHistory(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    } catch (e) {
      console.warn('Could not save chat history:', e);
    }
  }

  function loadHistory(){
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        history = JSON.parse(saved);
        if (history.length) {
          if (emptyState) emptyState.remove();
          history.forEach(msg => addBubble(msg.role, msg.content));
        }
      }
    } catch (e) {
      console.warn('Could not load chat history:', e);
    }
  }

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  function scrollToBottom(){
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function addBubble(role, text){
    if (emptyState) emptyState.remove();
    const row = document.createElement('div');
    row.className = 'msg-row ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + role;
    const label = document.createElement('span');
    label.className = 'role-label';
    label.textContent = role === 'user' ? 'You' : 'Lumen';
    bubble.appendChild(label);
    const content = document.createElement('span');
    content.textContent = text;
    bubble.appendChild(content);
    row.appendChild(bubble);
    chatWindow.appendChild(row);
    scrollToBottom();
    return content;
  }

  function addTyping(){
    const row = document.createElement('div');
    row.className = 'msg-row assistant';
    row.id = 'typingRow';
    const bubble = document.createElement('div');
    bubble.className = 'bubble assistant typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(bubble);
    chatWindow.appendChild(row);
    scrollToBottom();
  }

  function removeTyping(){
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  function addError(msg){
    const row = document.createElement('div');
    row.className = 'error-note';
    row.textContent = msg;
    chatWindow.appendChild(row);
    scrollToBottom();
  }

  async function sendMessage(text){
    history.push({ role: 'user', content: text });
    saveHistory();
    addTyping();
    sendBtn.disabled = true;

    try {
      const response = await fetch("https://api.longcat.chat/openai/v1/chat/completions", {
        method: "POST",
        headers: { "Authorization": "Bearer ak_27K4xF3jh8aA0gz8Dg39o0ag1mi5d", "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "LongCat-2.0",
          messages: history,
          max_tokens: 1000
        })
      });

      const data = await response.json();
      removeTyping();

      if (data.choices && data.choices.length) {
        const replyText = data.choices[0].message.content;
        addBubble('assistant', replyText);
        history.push({ role: 'assistant', content: replyText });
        saveHistory();
      } else {
        addError("No response received. Please try again.");
      }
    } catch (err) {
      removeTyping();
      addError("Connection error — please try again.");
      console.error(err);
    } finally {
      sendBtn.disabled = false;
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    addBubble('user', text);
    input.value = '';
    input.style.height = 'auto';
    sendMessage(text);
  });

  clearBtn.addEventListener('click', () => {
    history = [];
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    chatWindow.innerHTML = '';
    const fresh = document.createElement('div');
    fresh.className = 'empty-state';
    fresh.innerHTML = '<div class="glyph">Say something.</div><p>This is a see-through space to think — ask a question, brainstorm, or just talk something through.</p>';
    chatWindow.appendChild(fresh);
  });

  loadHistory();
</script>

</body>
</html>
